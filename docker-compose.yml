# =============================================================================
# Kener v4 — Production Docker Compose
#
# Usage:
#   docker compose up -d
#
# Defaults to the published image. To use a local build instead:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis — required for BullMQ queues, caching, and scheduler
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
    - "6379:6379"
    container_name: kener-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kener — Status Page Application
  # ---------------------------------------------------------------------------
  kener:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VARIANT: alpine # or "debian"
        NODE_VERSION: 24
        WITH_DOCS: "true"
        KENER_BASE_PATH: ""
    container_name: kener
    environment:
      # ── Required ──
      KENER_SECRET_KEY: 8d9c7f2a-2f31-4c3e-9e6c-6e0d0a6b7f3d
      ORIGIN: http://localhost:3000 
      REDIS_URL: redis://redis:6379

      DATABASE_URL: "mysql://statusdb:123456@mysql:3306/kener_db"

    ports:
      - "3000:3000"
    volumes:
      - data:/app/database
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional: MySQL / MariaDB (uncomment and set DATABASE_URL above)
  # ---------------------------------------------------------------------------
  mysql:
    image: mariadb:11
    ports:
    - "3306:3306"
    container_name: mysql
    environment:
      MYSQL_USER: "statusdb"
      MYSQL_PASSWORD: "123456"            # use a strong password
      MYSQL_DATABASE: "kener_db"
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
    name: kener_db
  redis_data:
    name: kener_redis
  mysql_data:
    name: mysql
